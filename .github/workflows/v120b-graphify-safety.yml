name: v120b Graphify safety patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[graphify-safety-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('main.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('let activeJob = null;\nlet updaterInitialized = false;','let activeJob = null;\nlet graphifyUpdatePromise = null;\nlet graphifyUpdateCheckedAt = 0;\nlet updaterInitialized = false;')
          marker='// ── Workspace scan ────────────────────────────────────────────'
          helper=r'''// ── Graphify lifecycle + smart preflight ─────────────────────
          const GRAPHIFY_UPDATE_TTL_MS = 6 * 60 * 60 * 1000;
          const GRAPHIFY_IGNORE_BEGIN = "# BEGIN GRAPH EXPLORER SMART EXCLUDES";
          const GRAPHIFY_IGNORE_END = "# END GRAPH EXPLORER SMART EXCLUDES";
          const SMART_EXCLUDE_NAMES = [
            "backups/", "backup/", "backup_original/", "**/backup_original/",
            "**/wineprefix/", "**/drive_c/windows/",
            "node_modules/", "vendor/", ".venv/", "venv/", ".tox/", ".nox/",
            "dist/", "build/", "target/", "coverage/", "__pycache__/"
          ];
          const SMART_EXCLUDE_PATTERNS = ["*.zip", "*.7z", "*.rar", "*.tar", "*.tar.gz", "*.tgz", "*.iso", "*.dmg", "*.img", "*.bak"];

          function parseVersion(value) {
            const match = String(value || "").match(/(\d+)\.(\d+)\.(\d+)/);
            return match ? match.slice(1, 4).map(Number) : null;
          }
          function compareVersions(a, b) {
            const av = parseVersion(a), bv = parseVersion(b);
            if (!av || !bv) return 0;
            for (let i = 0; i < 3; i++) if (av[i] !== bv[i]) return av[i] > bv[i] ? 1 : -1;
            return 0;
          }
          async function latestGraphifyVersion() {
            try {
              const response = await fetch("https://pypi.org/pypi/graphifyy/json", { signal: AbortSignal.timeout(12000) });
              if (!response.ok) return null;
              const payload = await response.json();
              return payload?.info?.version || null;
            } catch { return null; }
          }
          function runTool(command, args, timeoutMs = 180000) {
            return new Promise((resolvePromise, reject) => {
              const child = spawn(command, args, { windowsHide: true, shell: false });
              let output = "";
              let settled = false;
              const finish = (fn, value) => { if (settled) return; settled = true; clearTimeout(timer); fn(value); };
              const timer = setTimeout(() => { try { child.kill(); } catch {} finish(reject, new Error(`${command} excedeu ${timeoutMs}ms`)); }, timeoutMs);
              child.stdout?.on("data", (d) => (output += d.toString()));
              child.stderr?.on("data", (d) => (output += d.toString()));
              child.once("error", (error) => finish(reject, error));
              child.once("close", (code) => code === 0 ? finish(resolvePromise, output) : finish(reject, new Error(output || `${command} saiu com código ${code}`)));
            });
          }
          async function ensureLatestGraphify(force = false) {
            if (!force && graphifyUpdateCheckedAt && Date.now() - graphifyUpdateCheckedAt < GRAPHIFY_UPDATE_TTL_MS && graphifyCaps) return graphifyCaps;
            if (graphifyUpdatePromise) return graphifyUpdatePromise;
            graphifyUpdatePromise = (async () => {
              const before = await probeGraphify();
              const latest = await latestGraphifyVersion();
              let updateMessage = "";
              let updateError = null;
              const needsUpgrade = !before.installed || !latest || compareVersions(before.version, latest) < 0;
              if (needsUpgrade) {
                try {
                  updateMessage = before.installed
                    ? await runTool("uv", ["tool", "upgrade", "graphifyy"])
                    : await runTool("uv", ["tool", "install", "graphifyy"]);
                } catch (error) { updateError = error.message; }
              }
              const after = await probeGraphify();
              graphifyCaps = {
                ...after,
                latestVersion: latest,
                updateChecked: true,
                updateAvailable: Boolean(latest && after.installed && compareVersions(after.version, latest) < 0),
                updated: Boolean(before.installed && after.installed && before.version !== after.version),
                updateMessage: updateMessage.trim().slice(-1000),
                updateError,
              };
              graphifyUpdateCheckedAt = Date.now();
              return graphifyCaps;
            })().finally(() => { graphifyUpdatePromise = null; });
            return graphifyUpdatePromise;
          }
          function managedIgnoreBlock(extra = []) {
            const rules = [...new Set([...SMART_EXCLUDE_NAMES, ...SMART_EXCLUDE_PATTERNS, ...extra])];
            return `${GRAPHIFY_IGNORE_BEGIN}\n# Gerenciado pelo Graph Explorer. Evita backups, binários e árvores de dependências gigantes.\n${rules.join("\n")}\n${GRAPHIFY_IGNORE_END}`;
          }
          async function discoverLargeRootFiles(projectPath) {
            const extra = [];
            const scan = async (dir, depth = 0) => {
              if (depth > 1) return;
              let entries = [];
              try { entries = await fsp.readdir(dir, { withFileTypes: true }); } catch { return; }
              for (const entry of entries.slice(0, 5000)) {
                const full = join(dir, entry.name);
                const lower = entry.name.toLowerCase();
                if (entry.isDirectory()) {
                  if (["backups", "backup", "backup_original", "node_modules", "vendor", ".venv", "venv", "dist", "build", "target", "graphify-out"].includes(lower)) continue;
                  await scan(full, depth + 1);
                } else if (entry.isFile()) {
                  try {
                    const st = await fsp.stat(full);
                    if (st.size >= 512 * 1024 * 1024) extra.push('/' + relative(projectPath, full).replaceAll('\\', '/'));
                  } catch {}
                }
              }
            };
            await scan(projectPath, 0);
            return extra;
          }
          async function preflightGraphifyProject(projectPath) {
            const ignorePath = join(projectPath, ".graphifyignore");
            const hugeFiles = await discoverLargeRootFiles(projectPath);
            const block = managedIgnoreBlock(hugeFiles);
            let existing = "";
            try { existing = await fsp.readFile(ignorePath, "utf8"); } catch {}
            const start = existing.indexOf(GRAPHIFY_IGNORE_BEGIN);
            const end = existing.indexOf(GRAPHIFY_IGNORE_END);
            let next;
            if (start >= 0 && end >= start) {
              next = existing.slice(0, start) + block + existing.slice(end + GRAPHIFY_IGNORE_END.length);
            } else {
              next = `${existing.trimEnd()}${existing.trim() ? "\n\n" : ""}${block}\n`;
            }
            let written = false, warning = null;
            try { await fsp.writeFile(ignorePath, next, "utf8"); written = true; } catch (error) { warning = error.message; }
            return {
              written, warning, ignorePath, hugeFiles,
              summary: `Pastas ignoradas: backups, backup_original, wineprefix, dependências/builds e arquivos compactados${hugeFiles.length ? `; ${hugeFiles.length} arquivo(s) >= 512 MB` : ""}.`,
            };
          }

          '''
          if 'const GRAPHIFY_UPDATE_TTL_MS' not in s: s=s.replace(marker,helper+marker)

          old='''  if (operation === "generate") {\n    steps.push({ name: "Extraindo estrutura do código (AST)", args: ["extract", ".", "--code-only"] });\n    steps.push({ name: "Agrupando comunidades", args: ["cluster-only", "."] });\n    if (labelCfg.canLabel && p && p.backend) steps.push(labelStep(true));\n  } else if (operation === "update") {\n    if (graphifyCaps && graphifyCaps.update) {\n      steps.push({ name: "Atualizando grafo", args: ["update", "."] });\n    } else {\n      steps.push({ name: "Extraindo estrutura do código (AST)", args: ["extract", ".", "--code-only"] });\n      steps.push({ name: "Agrupando comunidades", args: ["cluster-only", "."] });\n    }\n  } else if (operation === "recluster") {\n    steps.push({ name: "Reagrupando comunidades", args: ["cluster-only", "."] });'''
          new='''  if (operation === "generate") {\n    steps.push({ name: "Extraindo estrutura do código (AST) — análise local", args: ["extract", ".", "--code-only", "--no-cluster"] });\n    steps.push({ name: "Agrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });\n  } else if (operation === "update") {\n    if (graphifyCaps && graphifyCaps.update) {\n      steps.push({ name: "Atualizando código — análise local", args: ["update", ".", "--no-cluster"] });\n      steps.push({ name: "Reagrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });\n    } else {\n      steps.push({ name: "Extraindo estrutura do código (AST) — análise local", args: ["extract", ".", "--code-only", "--no-cluster"] });\n      steps.push({ name: "Agrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });\n    }\n  } else if (operation === "recluster") {\n    steps.push({ name: "Reagrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });'''
          if old not in s: raise SystemExit('bloco de operações não encontrado')
          s=s.replace(old,new)
          s=s.replace('? ["label", ".", "--backend", p.backend, "--missing-only"]\n      : ["label", ".", "--backend", p.backend],','? ["label", ".", "--backend", p.backend, "--missing-only", "--no-viz"]\n      : ["label", ".", "--backend", p.backend, "--no-viz"],')

          oldrun='''    emit(job, { type: "started", message: "Iniciando " + operation });\n    for (const step of buildSteps(operation, labelCfg)) {'''
          newrun='''    emit(job, { type: "started", message: "Iniciando " + operation });\n    emit(job, { type: "stage", stage: "Verificando atualização do Graphify", message: "Verificando atualização do Graphify" });\n    const caps = await ensureLatestGraphify(false);\n    emit(job, { type: "stdout", message: `[Graphify] versão ${caps.version || "não detectada"}${caps.latestVersion ? ` · mais recente ${caps.latestVersion}` : ""}${caps.updated ? " · atualizado agora" : ""}\\n` });\n    if (caps.updateError) emit(job, { type: "stderr", message: `[Graphify] aviso de atualização: ${caps.updateError}\\n` });\n    emit(job, { type: "stage", stage: "Pré-análise e exclusões seguras", message: "Pré-análise e exclusões seguras" });\n    const preflight = await preflightGraphifyProject(job.projectPath);\n    emit(job, { type: "stdout", message: `[Graphify] ${preflight.summary}\\n[Graphify] ${preflight.written ? ".graphifyignore atualizado" : "não foi possível gravar .graphifyignore"}${preflight.warning ? `: ${preflight.warning}` : ""}\\n` });\n    for (const step of buildSteps(operation, labelCfg)) {'''
          if oldrun not in s: raise SystemExit('runJob insert point não encontrado')
          s=s.replace(oldrun,newrun)
          s=s.replace('emit(job, { type: "completed", message: "Concluído" });','emit(job, { type: "completed", message: operation === "relabel" ? "Otimização IA concluída" : "Grafo local concluído — use Otimizar IA quando quiser melhorar os nomes" });')
          s=s.replace('ipcMain.handle("graphify:detect", async () => {\n    if (!graphifyCaps) graphifyCaps = await probeGraphify();\n    return graphifyCaps;\n  });','ipcMain.handle("graphify:detect", async () => ensureLatestGraphify(false));')
          s=s.replace('createWindow();\n    initializeAutoUpdater();','createWindow();\n    ensureLatestGraphify(true).catch((error) => console.warn("[graphify:update]", error.message));\n    initializeAutoUpdater();')
          p.write_text(s,encoding='utf-8')

          Path('tests/v120-graphify-safety-static.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst main=fs.readFileSync("main.js","utf8");\nfor(const needle of ["ensureLatestGraphify","latestGraphifyVersion","preflightGraphifyProject","SMART_EXCLUDE_NAMES","SMART_EXCLUDE_PATTERNS",".graphifyignore","--no-cluster","--no-label","--no-viz","backups/","**/wineprefix/","*.zip"]){assert.ok(main.includes(needle),`main sem ${needle}`)}\nassert.ok(main.includes('["tool", "upgrade", "graphifyy"]'));\nassert.ok(!main.includes('if (labelCfg.canLabel && p && p.backend) steps.push(labelStep(true));'));\nconsole.log("V120_GRAPHIFY_SAFETY_STATIC_PASS");\n''',encoding='utf-8')
      - name: Validate
        run: |
          node --check main.js
          node tests/v120-graphify-safety-static.mjs
          node tests/v119-unified-force-static.mjs
          node tests/v116-visual-worker.mjs
          node tests/v115-graph-worker.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name "Graph Explorer CI"
          git config user.email "actions@users.noreply.github.com"
          git add main.js tests/v120-graphify-safety-static.mjs
          git commit -m "feat: smart Graphify preflight and automatic upgrades [graphify-safety-applied]"
          git push origin HEAD:main
