name: Harden Graph Explorer v1.1.5 feature

on:
  push:
    branches:
      - feat/large-graph-model-picker
    paths:
      - .github/workflows/harden-v115.yml
      - tests/v115-static-check.mjs
      - scripts/harden-v115.mjs

permissions:
  contents: write

jobs:
  harden-test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/harden-v115.mjs
          if ($LASTEXITCODE -ne 0) { throw "harden-v115 falhou" }
          node --check main.js
          node --check preload.cjs
          node --check public/graph-data-worker.cjs
          node --check public/graph-json-viewer.js
          if ($LASTEXITCODE -ne 0) { throw "syntax check falhou" }

      - name: Run v1.1.5 tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node tests/v115-graph-worker.mjs
          node tests/v115-static-check.mjs
          if ($LASTEXITCODE -ne 0) { throw "v1.1.5 tests falharam" }
          $main = Get-Content main.js -Raw
          $pkg = Get-Content package.json -Raw
          if (!$main.Contains('labelStep(false)')) { throw "relabel completo ausente" }
          if (!$main.Contains('app.asar.unpacked')) { throw "worker empacotado não usa app.asar.unpacked" }
          if (!$main.Contains('opencode_zen') -or !$main.Contains('opencode_go')) { throw "OpenCode providers ausentes" }
          if (!$pkg.Contains('public/graph-data-worker.cjs')) { throw "asarUnpack do worker ausente" }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npx electron-builder --win nsis portable --publish never

      - name: Validate packaged worker and artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @(
            "dist/Graph-Explorer-Setup-1.1.5.exe",
            "dist/Graph-Explorer-Setup-1.1.5.exe.blockmap",
            "dist/Graph-Explorer-1.1.5.exe",
            "dist/latest.yml",
            "dist/win-unpacked/resources/app.asar.unpacked/public/graph-data-worker.cjs"
          )) { if (!(Test-Path $f)) { throw "Artefato ausente: $f" } }

      - name: Commit hardened feature source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js package.json package-lock.json public/graph-data-worker.cjs
          if (git diff --cached --quiet) { Write-Host "No hardening changes"; exit 0 }
          git commit -m "fix: harden v1.1.5 large graph runtime and relabel"
          if ($LASTEXITCODE -ne 0) { throw "Commit falhou" }
          git push origin HEAD:feat/large-graph-model-picker
          if ($LASTEXITCODE -ne 0) { throw "Push falhou" }
