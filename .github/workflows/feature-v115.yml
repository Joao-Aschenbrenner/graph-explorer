name: Validate Graph Explorer v1.1.5 feature

on:
  push:
    branches:
      - feat/large-graph-model-picker
    paths:
      - .github/workflows/feature-v115.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v1.1.5 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/apply-v115.mjs
          if ($LASTEXITCODE -ne 0) { throw "apply-v115 falhou" }
          node --check main.js
          if ($LASTEXITCODE -ne 0) { throw "main.js inválido" }
          node --check preload.cjs
          if ($LASTEXITCODE -ne 0) { throw "preload.cjs inválido" }
          node --check public/graph-data-worker.cjs
          if ($LASTEXITCODE -ne 0) { throw "graph-data-worker.cjs inválido" }
          node --check public/graph-json-viewer.js
          if ($LASTEXITCODE -ne 0) { throw "graph-json-viewer.js inválido" }

      - name: Run v1.1.5 unit and contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node tests/v115-graph-worker.mjs
          if ($LASTEXITCODE -ne 0) { throw "worker tests falharam" }
          node tests/v115-static-check.mjs
          if ($LASTEXITCODE -ne 0) { throw "contract tests falharam" }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npx electron-builder --win nsis portable --publish never

      - name: Validate packaged resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @(
            "dist/Graph-Explorer-Setup-1.1.5.exe",
            "dist/Graph-Explorer-Setup-1.1.5.exe.blockmap",
            "dist/Graph-Explorer-1.1.5.exe",
            "dist/latest.yml"
          )) { if (!(Test-Path $f)) { throw "Artefato ausente: $f" } }
          if (!(Test-Path "public/graph-data-worker.cjs")) { throw "worker ausente" }
          if (!(Test-Path "public/graph-json-viewer.js")) { throw "viewer ausente" }

      - name: Commit validated feature source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js preload.cjs public/index.html package.json package-lock.json
          if (git diff --cached --quiet) { Write-Host "No generated source changes"; exit 0 }
          git commit -m "feat: v1.1.5 large graph viewer and dynamic model picker"
          if ($LASTEXITCODE -ne 0) { throw "Commit falhou" }
          git push origin HEAD:feat/large-graph-model-picker
          if ($LASTEXITCODE -ne 0) { throw "Push falhou" }
