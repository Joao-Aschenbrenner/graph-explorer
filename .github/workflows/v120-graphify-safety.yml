name: v120 Graphify safety patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[graphify-safety-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Graphify safety patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('main.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            'let activeJob = null;\nlet updaterInitialized = false;',
            'let activeJob = null;\nlet graphifyUpdatePromise = null;\nlet graphifyUpdateCheckedAt = 0;\nlet updaterInitialized = false;'
          )

          marker = '// ── Workspace scan ────────────────────────────────────────────'
          helper = r'''// ── Graphify lifecycle + smart preflight ─────────────────────
          const GRAPHIFY_UPDATE_TTL_MS = 6 * 60 * 60 * 1000;
          const GRAPHIFY_IGNORE_BEGIN = "# BEGIN GRAPH EXPLORER SMART EXCLUDES";
          const GRAPHIFY_IGNORE_END = "# END GRAPH EXPLORER SMART EXCLUDES";
          const SMART_EXCLUDE_NAMES = [
            "backups/", "backup/", "backup_original/", "**/backup_original/",
            "**/wineprefix/", "**/drive_c/windows/",
            "node_modules/", "vendor/", ".venv/", "venv/", ".tox/", ".nox/",
            "dist/", "build/", "target/", "coverage/", "__pycache__/"
          ];
          const SMART_EXCLUDE_PATTERNS = [
            "*.zip", "*.7z", "*.rar", "*.tar", "*.tar.gz", "*.tgz",
            "*.iso", "*.dmg", "*.img", "*.bak"
          ];

          function parseVersion(value) {
            const match = String(value || "").match(/(\d+)\.(\d+)\.(\d+)/);
            return match ? match.slice(1, 4).map(Number) : null;
          }
          function compareVersions(a, b) {
            const av = parseVersion(a), bv = parseVersion(b);
            if (!av || !bv) return 0;
            for (let i = 0; i < 3; i++) if (av[i] !== bv[i]) return av[i] > bv[i] ? 1 : -1;
            return 0;
          }
          async function latestGraphifyVersion() {
            try {
              const response = await fetch("https://pypi.org/pypi/graphifyy/json", { signal: AbortSignal.timeout(12000) });
              if (!response.ok) return null;
              const payload = await response.json();
              return payload?.info?.version || null;
            } catch { return null; }
          }
          function runTool(command, args, timeoutMs = 180000) {
            return new Promise((resolvePromise, reject) => {
              const child = spawn(command, args, { windowsHide: true, shell: false });
              let output = "";
              const timer = setTimeout(() => { try { child.kill(); } catch {} reject(new Error(`${command} excedeu ${timeoutMs}ms`)); }, timeoutMs);
              child.stdout?.on("data", (d) => (output += d.toString()));
              child.stderr?.on("data", (d) => (output += d.toString()));
              child.once("error", (error) => { clearTimeout(timer); reject(error); });
              child.once("close", (code) => { clearTimeout(timer); code === 0 ? resolvePromise(output) : reject(new Error(output || `${command} saiu com código ${code}`)); });
            });
          }
          async function ensureLatestGraphify(force = false) {
            if (!force && graphifyUpdateCheckedAt && Date.now() - graphifyUpdateCheckedAt < GRAPHIFY_UPDATE_TTL_MS && graphifyCaps) return graphifyCaps;
            if (graphifyUpdatePromise) return graphifyUpdatePromise;
            graphifyUpdatePromise = (async () => {
              const before = await probeGraphify();
              const latest = await latestGraphifyVersion();
              let updateMessage = "";
              let updateError = null;
              const needsUpgrade = !before.installed || !latest || compareVersions(before.version, latest) < 0;
              if (needsUpgrade) {
                try {
                  if (before.installed) {
                    updateMessage = await runTool("uv", ["tool", "upgrade", "graphifyy"]);
                  } else {
                    updateMessage = await runTool("uv", ["tool", "install", "graphifyy"]);
                  }
                } catch (error) {
                  updateError = error.message;
                }
              }
              const after = await probeGraphify();
              graphifyCaps = {
                ...after,
                latestVersion: latest,
                updateChecked: true,
                updateAvailable: Boolean(latest && after.installed && compareVersions(after.version, latest) < 0),
                updated: Boolean(before.installed && after.installed && before.version !== after.version),
                updateMessage: updateMessage.trim().slice(-1000),
                updateError,
              };
              graphifyUpdateCheckedAt = Date.now();
              return graphifyCaps;
            })().finally(() => { graphifyUpdatePromise = null; });
            return graphifyUpdatePromise;
          }

          function managedIgnoreBlock(extra = []) {
            const rules = [...new Set([...SMART_EXCLUDE_NAMES, ...SMART_EXCLUDE_PATTERNS, ...extra])];
            return `${GRAPHIFY_IGNORE_BEGIN}\n# Gerenciado pelo Graph Explorer. Evita backups, binários e árvores de dependências gigantes.\n${rules.join("\n")}\n${GRAPHIFY_IGNORE_END}`;
          }
          async function discoverLargeRootFiles(projectPath) {
            const extra = [];
            const scan = async (dir, depth = 0) => {
              if (depth > 1) return;
              let entries = [];
              try { entries = await fsp.readdir(dir, { withFileTypes: true }); } catch { return; }
              for (const entry of entries.slice(0, 5000)) {
                const full = join(dir, entry.name);
                const lower = entry.name.toLowerCase();
                if (entry.isDirectory()) {
                  if (["backups", "backup", "backup_original", "node_modules", "vendor", ".venv", "venv", "dist", "build", "target", "graphify-out"].includes(lower)) continue;
                  await scan(full, depth + 1);
                } else if (entry.isFile()) {
                  try {
                    const st = await fsp.stat(full);
                    if (st.size >= 512 * 1024 * 1024) {
                      const rel = relative(projectPath, full).replaceAll("\\", "/");
                      extra.push(`/${rel}`);
                    }
                  } catch {}
                }
              }
            };
            await scan(projectPath, 0);
            return extra;
          }
          async function preflightGraphifyProject(projectPath) {
            const ignorePath = join(projectPath, ".graphifyignore");
            const hugeFiles = await discoverLargeRootFiles(projectPath);
            const block = managedIgnoreBlock(hugeFiles);
            let existing = "";
            try { existing = await fsp.readFile(ignorePath, "utf8"); } catch {}
            const escapedBegin = GRAPHIFY_IGNORE_BEGIN.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const escapedEnd = GRAPHIFY_IGNORE_END.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const managedRe = new RegExp(`${escapedBegin}[\\s\\S]*?${escapedEnd}`, "m");
            const next = managedRe.test(existing)
              ? existing.replace(managedRe, block)
              : `${existing.trimEnd()}${existing.trim() ? "\n\n" : ""}${block}\n`;
            let written = false;
            let warning = null;
            try {
              await fsp.writeFile(ignorePath, next, "utf8");
              written = true;
            } catch (error) { warning = error.message; }
            return {
              written,
              warning,
              ignorePath,
              rules: SMART_EXCLUDE_NAMES.length + SMART_EXCLUDE_PATTERNS.length + hugeFiles.length,
              hugeFiles,
              summary: `Pastas ignoradas: backups, backup_original, wineprefix, dependências/builds e arquivos compactados${hugeFiles.length ? `; ${hugeFiles.length} arquivo(s) >= 512 MB` : ""}.`,
            };
          }

          '''
          if 'const GRAPHIFY_UPDATE_TTL_MS' not in s:
            s = s.replace(marker, helper + marker)

          old_steps = r'''function buildSteps(operation, labelCfg) {
            const steps = [];
            const p = PROVIDERS[labelCfg.provider];
            const labelStep = (missingOnly = true) => ({
              name: "Otimizando nomes das comunidades com IA (" + p.label + ")",
              args: missingOnly
                ? ["label", ".", "--backend", p.backend, "--missing-only"]
                : ["label", ".", "--backend", p.backend],
              env: labelCfg.env,
            });

            if (operation === "generate") {
              steps.push({ name: "Extraindo estrutura do código (AST)", args: ["extract", ".", "--code-only"] });
              steps.push({ name: "Agrupando comunidades", args: ["cluster-only", "."] });
              if (labelCfg.canLabel && p && p.backend) steps.push(labelStep(true));
            } else if (operation === "update") {
              if (graphifyCaps && graphifyCaps.update) {
                steps.push({ name: "Atualizando grafo", args: ["update", "."] });
              } else {
                steps.push({ name: "Extraindo estrutura do código (AST)", args: ["extract", ".", "--code-only"] });
                steps.push({ name: "Agrupando comunidades", args: ["cluster-only", "."] });
              }
            } else if (operation === "recluster") {
              steps.push({ name: "Reagrupando comunidades", args: ["cluster-only", "."] });
            } else if (operation === "relabel") {
              if (!p || !p.backend) throw new Error("Provedor sem backend de IA");
              steps.push(labelStep(false));
            }
            return steps;
          }'''
          new_steps = r'''function buildSteps(operation, labelCfg) {
            const steps = [];
            const p = PROVIDERS[labelCfg.provider];
            const labelStep = (missingOnly = true) => ({
              name: "Otimizando nomes das comunidades com IA (" + p.label + ")",
              args: missingOnly
                ? ["label", ".", "--backend", p.backend, "--missing-only", "--no-viz"]
                : ["label", ".", "--backend", p.backend, "--no-viz"],
              env: labelCfg.env,
            });

            if (operation === "generate") {
              // Fase 1 é sempre local: zero chamadas de IA e sem HTML do Graphify.
              steps.push({ name: "Extraindo estrutura do código (AST) — análise local", args: ["extract", ".", "--code-only", "--no-cluster"] });
              steps.push({ name: "Agrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });
            } else if (operation === "update") {
              if (graphifyCaps && graphifyCaps.update) {
                steps.push({ name: "Atualizando código — análise local", args: ["update", ".", "--no-cluster"] });
                steps.push({ name: "Reagrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });
              } else {
                steps.push({ name: "Extraindo estrutura do código (AST) — análise local", args: ["extract", ".", "--code-only", "--no-cluster"] });
                steps.push({ name: "Agrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });
              }
            } else if (operation === "recluster") {
              steps.push({ name: "Reagrupando comunidades — sem IA", args: ["cluster-only", ".", "--no-label", "--no-viz"] });
            } else if (operation === "relabel") {
              if (!p || !p.backend) throw new Error("Provedor sem backend de IA");
              steps.push(labelStep(false));
            }
            return steps;
          }'''
          if old_steps not in s:
            raise SystemExit('buildSteps original não encontrado')
          s = s.replace(old_steps, new_steps)

          old_run = r'''async function runJob(job, operation, labelCfg) {
            try {
              emit(job, { type: "started", message: "Iniciando " + operation });
              for (const step of buildSteps(operation, labelCfg)) {
                if (job.cancelled) throw new Error("cancelled");
                emit(job, { type: "stage", stage: step.name, message: step.name });
                await spawnStep(step, job);
              }
              if (job.cancelled) throw new Error("cancelled");
              emit(job, { type: "completed", message: "Concluído" });
            } catch (e) {
              if (String(e.message).includes("cancelled")) emit(job, { type: "cancelled", message: "Cancelado" });
              else emit(job, { type: "failed", message: e.message });
            } finally {
              activeJob = null;
            }
          }'''
          new_run = r'''async function runJob(job, operation, labelCfg) {
            try {
              emit(job, { type: "started", message: "Iniciando " + operation });
              emit(job, { type: "stage", stage: "Verificando atualização do Graphify", message: "Verificando atualização do Graphify" });
              const caps = await ensureLatestGraphify(false);
              emit(job, { type: "stdout", message: `[Graphify] versão ${caps.version || "não detectada"}${caps.latestVersion ? ` · mais recente ${caps.latestVersion}` : ""}${caps.updated ? " · atualizado agora" : ""}\n` });
              if (caps.updateError) emit(job, { type: "stderr", message: `[Graphify] aviso de atualização: ${caps.updateError}\n` });

              emit(job, { type: "stage", stage: "Pré-análise e exclusões seguras", message: "Pré-análise e exclusões seguras" });
              const preflight = await preflightGraphifyProject(job.projectPath);
              emit(job, { type: "stdout", message: `[Graphify] ${preflight.summary}\n[Graphify] ${preflight.written ? ".graphifyignore atualizado" : "não foi possível gravar .graphifyignore"}${preflight.warning ? `: ${preflight.warning}` : ""}\n` });

              for (const step of buildSteps(operation, labelCfg)) {
                if (job.cancelled) throw new Error("cancelled");
                emit(job, { type: "stage", stage: step.name, message: step.name });
                await spawnStep(step, job);
              }
              if (job.cancelled) throw new Error("cancelled");
              const message = operation === "relabel" ? "Otimização IA concluída" : "Grafo local concluído — use Otimizar IA quando quiser melhorar os nomes";
              emit(job, { type: "completed", message });
            } catch (e) {
              if (String(e.message).includes("cancelled")) emit(job, { type: "cancelled", message: "Cancelado" });
              else emit(job, { type: "failed", message: e.message });
            } finally {
              activeJob = null;
            }
          }'''
          if old_run not in s:
            raise SystemExit('runJob original não encontrado')
          s = s.replace(old_run, new_run)

          s = s.replace(
            'ipcMain.handle("graphify:detect", async () => {\n    if (!graphifyCaps) graphifyCaps = await probeGraphify();\n    return graphifyCaps;\n  });',
            'ipcMain.handle("graphify:detect", async () => ensureLatestGraphify(false));'
          )

          old_install = '''ipcMain.handle("graphify:install", async () => {
            if (process.platform !== "win32") return { ok: false, error: "Instalação automática disponível apenas no Windows nesta versão." };
            try {
              await new Promise((resolve, reject) => {
                const child = spawn("uv", ["tool", "install", "graphifyy"], { windowsHide: true, shell: false });
                let output = "";
                child.stdout.on("data", (d) => (output += d.toString()));
                child.stderr.on("data", (d) => (output += d.toString()));
                child.on("error", reject);
                child.on("close", (code) => code === 0 ? resolve(output) : reject(new Error(output || "npm saiu com código " + code)));
              });
              graphifyCaps = await probeGraphify();
              return { ok: graphifyCaps.installed, caps: graphifyCaps, message: graphifyCaps.installed ? "Graphify instalado com sucesso." : "A instalação terminou, mas o comando graphify ainda não foi encontrado." };
            } catch (e) {
              graphifyCaps = await probeGraphify();
              return { ok: false, caps: graphifyCaps, error: e.message };
            }
          });'''
          new_install = '''ipcMain.handle("graphify:install", async () => {
            try {
              const caps = await ensureLatestGraphify(true);
              return { ok: caps.installed, caps, message: caps.installed ? `Graphify pronto na versão ${caps.version}` : "Graphify não pôde ser instalado." };
            } catch (e) {
              graphifyCaps = await probeGraphify();
              return { ok: false, caps: graphifyCaps, error: e.message };
            }
          });'''
          if old_install not in s:
            raise SystemExit('handler install original não encontrado')
          s = s.replace(old_install, new_install)

          s = s.replace(
            'createWindow();\n    initializeAutoUpdater();',
            'createWindow();\n    // Sempre verifica o Graphify em segundo plano ao abrir. Um job também aguarda esta mesma verificação.\n    ensureLatestGraphify(true).catch((error) => console.warn("[graphify:update]", error.message));\n    initializeAutoUpdater();'
          )

          p.write_text(s, encoding='utf-8')

          test = Path('tests/v120-graphify-safety-static.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst main = fs.readFileSync("main.js", "utf8");\nfor (const needle of [\n  "ensureLatestGraphify", "latestGraphifyVersion", "uv\\\", [\\\"tool\\\", \\\"upgrade\\\", \\\"graphifyy\\\"]",\n  "preflightGraphifyProject", "SMART_EXCLUDE_NAMES", "SMART_EXCLUDE_PATTERNS", ".graphifyignore",\n  "--no-cluster", "--no-label", "--no-viz", "Análise local primeiro"\n]) assert.ok(main.includes(needle), `main sem contrato: ${needle}`);\nassert.ok(!main.includes("if (labelCfg.canLabel && p && p.backend) steps.push(labelStep(true));"), "generate ainda chama IA automaticamente");\nassert.ok(main.includes("backups/"));\nassert.ok(main.includes("**/wineprefix/"));\nassert.ok(main.includes("*.zip"));\nconsole.log("V120_GRAPHIFY_SAFETY_STATIC_PASS");\n''', encoding='utf-8')

      - name: Static validation
        run: |
          node --check main.js
          node tests/v120-graphify-safety-static.mjs
          node tests/v119-unified-force-static.mjs
          node tests/v116-visual-worker.mjs
          node tests/v115-graph-worker.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Graph Explorer CI"
          git config user.email "actions@users.noreply.github.com"
          git add main.js tests/v120-graphify-safety-static.mjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: smart Graphify preflight and automatic upgrades [graphify-safety-applied]"
          git push origin HEAD:main
